apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lightning
spec:
  template:
    spec:
      containers:
      - name: api
        image: unum-apps-lightning-api
        imagePullPolicy: Never
        command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "/opt/service/bin/api.py"]
        env:
        - name: LOG_LEVEL
          value: INFO
        ports:
        - name: debug
          containerPort: 5678
          protocol: TCP
